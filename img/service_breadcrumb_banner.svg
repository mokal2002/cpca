<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="200" viewBox="0 0 900 200">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#063A78"/>
      <stop offset="55%" stop-color="#015FC9"/>
      <stop offset="100%" stop-color="#0A2D5C"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#70C7FF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD86A"/>
      <stop offset="100%" stop-color="#FFB648"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8"
                    flood-color="#001C3D" flood-opacity=".25"/>
    </filter>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF"
            stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Main banner -->
  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <rect width="900" height="200" fill="url(#grid)"/>

  <!-- Decorative glow -->
  <ellipse cx="760" cy="30" rx="220" ry="150" fill="url(#glow)"/>
  <ellipse cx="100" cy="210" rx="230" ry="110" fill="#4FA3F7" opacity=".12"/>

  <!-- Abstract curved waves -->
  <path d="M0 160 C130 95 205 125 310 165
           C420 207 510 185 610 130
           C720 70 800 76 900 118"
        fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="30"/>

  <path d="M0 174 C125 110 215 142 315 176
           C420 212 520 191 620 138
           C730 80 810 88 900 126"
        fill="none" stroke="#70C7FF" stroke-opacity=".16" stroke-width="3"/>

  <!-- Left decorative document -->
  <g transform="translate(85 48) rotate(-8)" filter="url(#softShadow)">
    <rect x="0" y="0" width="115" height="125" rx="10"
          fill="#FFFFFF" fill-opacity=".96"/>
    <rect x="16" y="18" width="52" height="8" rx="4" fill="#015FC9"/>
    <rect x="16" y="37" width="78" height="5" rx="2.5" fill="#CFE4FB"/>
    <rect x="16" y="50" width="65" height="5" rx="2.5" fill="#CFE4FB"/>
    <rect x="16" y="63" width="76" height="5" rx="2.5" fill="#CFE4FB"/>
    <rect x="16" y="84" width="15" height="25" rx="3" fill="#4FA3F7"/>
    <rect x="38" y="74" width="15" height="35" rx="3" fill="#015FC9"/>
    <rect x="60" y="91" width="15" height="18" rx="3" fill="#FFB648"/>
    <rect x="82" y="66" width="15" height="43" rx="3" fill="#3FAE6B"/>
  </g>

  <!-- Center abstract business shield -->
  <!-- <g transform="translate(450 99)" filter="url(#softShadow)">
    <path d="M0 -57 L66 -34 V12
             C66 53 34 78 0 91
             C-34 78 -66 53 -66 12 V-34Z"
          fill="#FFFFFF" fill-opacity=".96"/>

    <path d="M0 -42 L49 -25 V10
             C49 40 28 58 0 70
             C-28 58 -49 40 -49 10 V-25Z"
          fill="#EAF3FF"/>

    <path d="M-24 9 L-7 26 L28 -16"
          fill="none"
          stroke="#015FC9"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <circle cx="39" cy="-35" r="17" fill="url(#gold)"/>
    <path d="M31 -35 L37 -29 L48 -42"
          fill="none" stroke="#FFFFFF" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g> -->

  <!-- Right growth chart -->
  <g transform="translate(690 38)" filter="url(#softShadow)">
    <rect x="0" y="0" width="150" height="125" rx="12"
          fill="#FFFFFF" fill-opacity=".96"/>

    <path d="M22 100 H128" stroke="#CFE4FB" stroke-width="3"/>
    <path d="M22 100 V22" stroke="#CFE4FB" stroke-width="3"/>

    <rect x="36" y="67" width="17" height="33" rx="3" fill="#4FA3F7"/>
    <rect x="61" y="52" width="17" height="48" rx="3" fill="#015FC9"/>
    <rect x="86" y="36" width="17" height="64" rx="3" fill="#3FAE6B"/>
    <rect x="111" y="20" width="17" height="80" rx="3" fill="url(#gold)"/>

    <path d="M30 57 C57 50 69 42 91 27 C103 19 113 13 130 9"
          fill="none" stroke="#0E2A5C" stroke-width="5"
          stroke-linecap="round"/>

    <path d="M121 9 H130 V18"
          fill="none" stroke="#0E2A5C" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating gold dots -->
  <circle cx="255" cy="40" r="7" fill="#FFB648" opacity=".9"/>
  <circle cx="290" cy="28" r="4" fill="#FFFFFF" opacity=".45"/>
  <circle cx="620" cy="164" r="7" fill="#70C7FF" opacity=".65"/>
  <circle cx="650" cy="178" r="4" fill="#FFFFFF" opacity=".4"/>

  <!-- Small connection nodes -->
  <g opacity=".55">
    <circle cx="245" cy="155" r="5" fill="#FFFFFF"/>
    <circle cx="280" cy="143" r="5" fill="#70C7FF"/>
    <circle cx="315" cy="158" r="5" fill="#FFFFFF"/>
    <path d="M245 155 L280 143 L315 158"
          fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Bottom accent -->
  <!-- <path d="M0 194 H900" stroke="#FFB648" stroke-width="6" opacity=".9"/> -->
</svg>