<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF3FF"/>
      <stop offset="100%" stop-color="#CFE4FB"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bgA)"/>
  <circle cx="355" cy="40" r="22" fill="#FFB648" opacity="0.85"/>
  <circle cx="30" cy="60" r="12" fill="#015FC9" opacity="0.2"/>
  <circle cx="25" cy="220" r="16" fill="#015FC9" opacity="0.15"/>

  <ellipse cx="200" cy="222" rx="140" ry="12" fill="#0A1F44" opacity="0.08"/>

  <!-- desk -->
  <rect x="70" y="188" width="260" height="12" rx="5" fill="#0E2A5C"/>
  <rect x="90" y="200" width="12" height="20" fill="#0A1F44"/>
  <rect x="298" y="200" width="12" height="20" fill="#0A1F44"/>

  <!-- calculator -->
  <g transform="translate(122,150)">
    <rect x="-28" y="-38" width="56" height="76" rx="8" fill="#0A1F44"/>
    <rect x="-21" y="-30" width="42" height="18" rx="3" fill="#9CC6F5"/>
    <circle cx="-12" cy="-2" r="5" fill="#4FA3F7"/>
    <circle cx="0" cy="-2" r="5" fill="#4FA3F7"/>
    <circle cx="12" cy="-2" r="5" fill="#4FA3F7"/>
    <circle cx="-12" cy="12" r="5" fill="#4FA3F7"/>
    <circle cx="0" cy="12" r="5" fill="#FFB648"/>
    <circle cx="12" cy="12" r="5" fill="#4FA3F7"/>
    <circle cx="-12" cy="26" r="5" fill="#4FA3F7"/>
    <circle cx="0" cy="26" r="5" fill="#4FA3F7"/>
    <circle cx="12" cy="26" r="5" fill="#4FA3F7"/>
  </g>

  <!-- rising bar chart card -->
  <g transform="translate(250,120)">
    <rect x="-52" y="-58" width="104" height="88" rx="10" fill="#FFFFFF" stroke="#CFE4FB" stroke-width="2"/>
    <rect x="-36" y="-8" width="12" height="18" rx="2" fill="#CFE4FB"/>
    <rect x="-16" y="-20" width="12" height="30" rx="2" fill="#4FA3F7"/>
    <rect x="4" y="-32" width="12" height="42" rx="2" fill="#015FC9"/>
    <rect x="24" y="-44" width="12" height="54" rx="2" fill="#FFB648"/>
  </g>

  <!-- rupee coin stack -->
  <g transform="translate(160,180)">
    <ellipse cx="0" cy="10" rx="20" ry="7" fill="#0A1F44" opacity="0.15"/>
    <ellipse cx="0" cy="2" rx="20" ry="7" fill="#FFB648"/>
    <ellipse cx="0" cy="-8" rx="20" ry="7" fill="#FFCB7A"/>
    <ellipse cx="0" cy="-18" rx="20" ry="7" fill="#FFB648"/>
    <text x="0" y="-13" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="700" fill="#0A1F44" text-anchor="middle">₹</text>
  </g>
