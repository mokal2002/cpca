    <text x="0" y="-15" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0A1F44" text-anchor="middle">₹</text>
  </g>

  <!-- growth chart card -->
  <g transform="translate(300,120)">
    <rect x="-46" y="-52" width="92" height="80" rx="10" fill="#FFFFFF" stroke="#CFE4FB" stroke-width="2"/>
    <path d="M-30 8 L-10 -12 L8 2 L28 -28" stroke="#015FC9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="28,-34 34,-24 22,-24" fill="#FFB648"/>
