<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF3FF"/>
      <stop offset="100%" stop-color="#CFE4FB"/>
    </linearGradient>
    <linearGradient id="umbE" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FA3F7"/>
      <stop offset="100%" stop-color="#015FC9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bgE)"/>
  <circle cx="45" cy="50" r="18" fill="#FFB648" opacity="0.85"/>
  <circle cx="360" cy="75" r="12" fill="#015FC9" opacity="0.2"/>
  <circle cx="355" cy="205" r="16" fill="#015FC9" opacity="0.15"/>

  <ellipse cx="200" cy="228" rx="150" ry="12" fill="#0A1F44" opacity="0.08"/>

  <!-- umbrella protecting coins (insurance + planning) -->
  <g transform="translate(160,110)">
    <path d="M-62 6 C-62 -34 -22 -60 0 -60 C22 -60 62 -34 62 6 C46 -6 34 6 18 6 C4 6 -4 -6 -18 6 C-34 6 -46 -6 -62 6 Z" fill="url(#umbE)"/>
    <rect x="-3" y="4" width="6" height="60" rx="3" fill="#0A1F44"/>
    <path d="M3 60 Q18 64 18 50" stroke="#0A1F44" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- coin stack under umbrella -->
  <g transform="translate(158,196)">
    <ellipse cx="0" cy="10" rx="26" ry="8" fill="#0A1F44" opacity="0.12"/>
    <ellipse cx="0" cy="0" rx="26" ry="8" fill="#FFB648"/>
    <ellipse cx="0" cy="-10" rx="26" ry="8" fill="#FFCB7A"/>
