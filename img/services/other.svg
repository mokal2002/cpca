      <rect x="-8" y="38" width="16" height="20" rx="3"/>
      <rect x="-58" y="-8" width="20" height="16" rx="3"/>
      <rect x="38" y="-8" width="20" height="16" rx="3"/>
      <rect x="-42" y="-42" width="16" height="20" rx="3" transform="rotate(-45 -34 -32)"/>
      <rect x="26" y="-42" width="16" height="20" rx="3" transform="rotate(45 34 -32)"/>
      <rect x="-42" y="22" width="16" height="20" rx="3" transform="rotate(45 -34 32)"/>
      <rect x="26" y="22" width="16" height="20" rx="3" transform="rotate(-45 34 32)"/>
