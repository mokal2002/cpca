    <linearGradient id="gearF" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FA3F7"/>
      <stop offset="100%" stop-color="#015FC9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bgF)"/>
  <circle cx="40" cy="55" r="16" fill="#FFB648" opacity="0.85"/>
  <circle cx="365" cy="70" r="12" fill="#015FC9" opacity="0.2"/>

  <ellipse cx="200" cy="228" rx="150" ry="12" fill="#0A1F44" opacity="0.08"/>

  <!-- central gear -->
