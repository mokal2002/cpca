<svg viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blobGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF3FF"/>
      <stop offset="100%" stop-color="#CFE4FB"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2A5C"/>
      <stop offset="100%" stop-color="#081B3E"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#015FC9"/>
      <stop offset="100%" stop-color="#4FA3F7"/>
    </linearGradient>
  </defs>

  <!-- backdrop blob -->
  <ellipse cx="300" cy="270" rx="255" ry="235" fill="url(#blobGrad1)"/>
  <circle cx="490" cy="90" r="34" fill="#FFB648" opacity="0.9"/>
  <circle cx="70" cy="120" r="16" fill="#015FC9" opacity="0.25"/>
  <circle cx="95" cy="410" r="22" fill="#015FC9" opacity="0.18"/>

  <!-- floor shadow -->
  <ellipse cx="300" cy="462" rx="190" ry="18" fill="#0A1F44" opacity="0.08"/>

  <!-- desk -->
  <rect x="120" y="330" width="360" height="18" rx="6" fill="url(#deskGrad)"/>
  <rect x="150" y="348" width="18" height="80" fill="#0A1F44"/>
  <rect x="432" y="348" width="18" height="80" fill="#0A1F44"/>

  <!-- laptop -->
  <g>
    <rect x="230" y="270" width="140" height="90" rx="8" fill="#0A1F44"/>
    <rect x="240" y="278" width="120" height="66" rx="4" fill="#E8F1FC"/>
    <rect x="200" y="358" width="200" height="12" rx="6" fill="#0E2A5C"/>
    <!-- chart on screen -->
    <rect x="254" y="316" width="10" height="22" fill="#015FC9"/>
    <rect x="270" y="306" width="10" height="32" fill="#4FA3F7"/>
    <rect x="286" y="296" width="10" height="42" fill="#015FC9"/>
    <rect x="302" y="284" width="10" height="54" fill="#FFB648"/>
    <path d="M254 320 L272 302 L288 312 L312 280" stroke="#0A1F44" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- floating bar chart card -->
  <g>
    <rect x="410" y="150" width="130" height="120" rx="14" fill="#FFFFFF" stroke="#CFE4FB" stroke-width="2"/>
    <rect x="428" y="230" width="14" height="24" rx="3" fill="url(#barGrad)"/>
    <rect x="450" y="212" width="14" height="42" rx="3" fill="url(#barGrad)"/>
    <rect x="472" y="196" width="14" height="58" rx="3" fill="#FFB648"/>
    <rect x="494" y="180" width="14" height="74" rx="3" fill="url(#barGrad)"/>
    <text x="475" y="170" font-family="DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0A1F44" text-anchor="middle">Growth</text>
  </g>

  <!-- rupee coin stack -->
  <g>
    <ellipse cx="130" cy="360" rx="26" ry="9" fill="#0A1F44" opacity="0.15"/>
    <ellipse cx="130" cy="352" rx="26" ry="9" fill="#FFB648"/>
    <ellipse cx="130" cy="340" rx="26" ry="9" fill="#FFCB7A"/>
    <ellipse cx="130" cy="328" rx="26" ry="9" fill="#FFB648"/>
    <text x="130" y="333" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0A1F44" text-anchor="middle">₹</text>
  </g>

  <!-- person -->
  <g>
    <ellipse cx="300" cy="240" rx="26" ry="27" fill="#E7B48C"/>
    <path d="M276 232 Q300 205 324 232 L324 222 Q300 200 276 222 Z" fill="#2B1B12"/>
    <path d="M260 340 Q262 268 300 262 Q338 268 340 340 Z" fill="#015FC9"/>
    <path d="M283 268 L317 268 L312 300 L288 300 Z" fill="#FFFFFF"/>
    <rect x="255" y="300" width="20" height="46" rx="9" fill="#0E2A5C" transform="rotate(-10 265 300)"/>
    <rect x="322" y="292" width="20" height="46" rx="9" fill="#0E2A5C" transform="rotate(20 332 292)"/>
  </g>
</svg>
