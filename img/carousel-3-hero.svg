<svg viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blobGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF3FF"/>
      <stop offset="100%" stop-color="#CFE4FB"/>
    </linearGradient>
    <linearGradient id="columnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCEBFB"/>
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="270" rx="255" ry="235" fill="url(#blobGrad3)"/>
  <circle cx="90" cy="110" r="20" fill="#015FC9" opacity="0.2"/>
  <circle cx="520" cy="160" r="16" fill="#FFB648" opacity="0.85"/>
  <circle cx="500" cy="410" r="24" fill="#015FC9" opacity="0.15"/>

  <ellipse cx="300" cy="466" rx="200" ry="18" fill="#0A1F44" opacity="0.08"/>

  <!-- courthouse building -->
  <g>
    <rect x="150" y="330" width="300" height="16" rx="4" fill="#0A1F44"/>
    <polygon points="300,255 460,325 140,325" fill="#0E2A5C"/>
    <rect x="170" y="285" width="18" height="45" fill="url(#columnGrad)"/>
    <rect x="210" y="285" width="18" height="45" fill="url(#columnGrad)"/>
    <rect x="250" y="285" width="18" height="45" fill="url(#columnGrad)"/>
    <rect x="290" y="285" width="18" height="45" fill="url(#columnGrad)"/>
    <rect x="330" y="285" width="18" height="45" fill="url(#columnGrad)"/>
    <rect x="370" y="285" width="18" height="45" fill="url(#columnGrad)"/>
    <rect x="410" y="285" width="18" height="45" fill="url(#columnGrad)"/>
    <rect x="160" y="278" width="280" height="10" rx="3" fill="#015FC9"/>
  </g>

  <!-- scales of justice, floating -->
  <g transform="translate(300,175)">
    <rect x="-4" y="-45" width="8" height="90" rx="3" fill="#0A1F44"/>
    <rect x="-46" y="-52" width="92" height="8" rx="4" fill="#0A1F44"/>
    <line x1="-42" y1="-48" x2="-42" y2="-10" stroke="#0A1F44" stroke-width="2"/>
    <line x1="42" y1="-48" x2="42" y2="-10" stroke="#0A1F44" stroke-width="2"/>
    <path d="M-62 -10 Q-42 20 -22 -10 Z" fill="url(#shieldGrad2)" fill-opacity="1"/>
    <path d="M-62 -10 Q-42 20 -22 -10" fill="none" stroke="#0A1F44" stroke-width="2"/>
    <path d="M22 -10 Q42 20 62 -10 Z" fill="#FFB648"/>
    <path d="M22 -10 Q42 20 62 -10" fill="none" stroke="#0A1F44" stroke-width="2"/>
    <circle cx="0" cy="-52" r="8" fill="#015FC9"/>
    <ellipse cx="0" cy="48" rx="26" ry="7" fill="#0A1F44"/>
  </g>
  <defs>
    <linearGradient id="shieldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FA3F7"/>
      <stop offset="100%" stop-color="#015FC9"/>
    </linearGradient>
  </defs>

  <!-- gavel -->
  <g transform="translate(150,190) rotate(-25)">
    <rect x="-10" y="-46" width="20" height="34" rx="5" fill="#0A1F44"/>
    <rect x="-6" y="-14" width="12" height="60" rx="4" fill="#8A5A2B"/>
  </g>

  <!-- person pointing / presenting -->
  <g>
    <ellipse cx="430" cy="380" rx="24" ry="25" fill="#E7B48C"/>
    <path d="M408 372 Q430 348 452 372 L452 363 Q430 343 408 363 Z" fill="#2B1B12"/>
    <path d="M396 438 Q398 398 430 390 Q463 398 465 438 Z" fill="#015FC9"/>
    <path d="M415 394 L447 394 L442 418 L420 418 Z" fill="#FFFFFF"/>
    <rect x="382" y="382" width="18" height="42" rx="8" fill="#0E2A5C" transform="rotate(-30 391 382)"/>
  </g>
</svg>
